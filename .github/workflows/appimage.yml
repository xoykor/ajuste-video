name: AppImage

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ qt6-base-dev qt6-wayland-dev wget file desktop-file-utils
      - name: Build and stage application
        run: |
          cmake -S . -B build -DBUILD_KWIN_EFFECT=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel
          DESTDIR="$PWD/AppDir" cmake --install build
          test -f AppDir/usr/share/ajuste-video/source/main.cpp
          test -f AppDir/usr/share/ajuste-video/source/effect.cpp
          mkdir -p AppDir/usr/share/metainfo
      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          chmod +x linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-plugin-qt-x86_64.AppImage
      - name: Bundle AppImage
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$(command -v qmake6)"
          export EXTRA_PLATFORM_PLUGINS="libqwayland-egl.so;libqwayland-generic.so"
          ./linuxdeploy --appdir AppDir --desktop-file AppDir/usr/share/applications/ajuste-video.desktop --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/ajuste-video.svg --plugin qt --output appimage
          mv Ajuste_de_vídeo-x86_64.AppImage ajuste-video-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: ajuste-video-appimage
          path: ajuste-video-x86_64.AppImage
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ajuste-video-x86_64.AppImage
